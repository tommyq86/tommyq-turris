# Globální proměnné pro tommyq.cz
var.nas_ip = "192.168.2.4"

# HTTP/2 tuning - increase limits for connection issues
server.feature-flags += (
    "server.h2c" => "enable",
    "server.h2-max-concurrent-streams" => 128,
    "server.h2-max-header-list-size" => 65536
)

# tommyq.cz - Base domain configuration
# Redirect HTTP to HTTPS (except ca.crt)
$HTTP["scheme"] == "http" {
    $HTTP["host"] =~ "(^|\.)tommyq\.cz$" {
        $HTTP["url"] != "/ca.crt" {
            url.redirect = ( "^/(.*)" => "https://%0/$1" )
        }
    }
}

# HTTPS - Global SSL for tommyq.cz and *.tommyq.cz
$HTTP["host"] =~ "(^|\.)tommyq\.cz$" {
    ssl.pemfile = "/etc/ssl/certs/turris_combined.pem"
}

# Access from the internet goes only through Cloudflare, where Cloudflare Access asks
# for sign-in (managed with: cloudflare_manager.py access …). Without this, anyone who
# knows the public IP could connect straight to the router and skip Access. So every
# tommyq.cz vhost answers only the home networks (LAN, OpenVPN, the router itself)
# and Cloudflare's edge; sport and plex are public and stay open to everyone.
# Cloudflare ranges: https://www.cloudflare.com/ips (as of 2026-11; refresh when
# Cloudflare adds ranges — the symptom would be a 403 for some visitors via Cloudflare).
server.modules += ( "mod_access" )
$HTTP["host"] =~ "(^|\.)tommyq\.cz$" {
    $HTTP["host"] !~ "^(sport|plex)\.tommyq\.cz$" {
        $HTTP["remoteip"] == "192.168.2.0/24" { }
        else $HTTP["remoteip"] == "10.111.111.0/24" { }
        else $HTTP["remoteip"] == "127.0.0.1" { }
        else $HTTP["remoteip"] == "173.245.48.0/20" { }
        else $HTTP["remoteip"] == "103.21.244.0/22" { }
        else $HTTP["remoteip"] == "103.22.200.0/22" { }
        else $HTTP["remoteip"] == "103.31.4.0/22" { }
        else $HTTP["remoteip"] == "141.101.64.0/18" { }
        else $HTTP["remoteip"] == "108.162.192.0/18" { }
        else $HTTP["remoteip"] == "190.93.240.0/20" { }
        else $HTTP["remoteip"] == "188.114.96.0/20" { }
        else $HTTP["remoteip"] == "197.234.240.0/22" { }
        else $HTTP["remoteip"] == "198.41.128.0/17" { }
        else $HTTP["remoteip"] == "162.158.0.0/15" { }
        else $HTTP["remoteip"] == "104.16.0.0/13" { }
        else $HTTP["remoteip"] == "104.24.0.0/14" { }
        else $HTTP["remoteip"] == "172.64.0.0/13" { }
        else $HTTP["remoteip"] == "131.0.72.0/22" { }
        else $HTTP["remoteip"] == "2400:cb00::/32" { }
        else $HTTP["remoteip"] == "2606:4700::/32" { }
        else $HTTP["remoteip"] == "2803:f800::/32" { }
        else $HTTP["remoteip"] == "2405:b500::/32" { }
        else $HTTP["remoteip"] == "2405:8100::/32" { }
        else $HTTP["remoteip"] == "2a06:98c0::/29" { }
        else $HTTP["remoteip"] == "2c0f:f248::/32" { }
        else { url.access-deny = ( "" ) }
    }
}

# Services on the NAS: instead of a bare 500/502/503/504 (NAS asleep, container restarting)
# show a loading screen that wakes the NAS, waits for the service and reloads itself
# (errors/status-503.html, deployed as status-{500,502,503,504}.html). Applies to every
# *.tommyq.cz vhost except sport (its own CGI/tile/BRouter errors must stay plain
# for API clients) and Plex (has its own fallback to app.plex.tv). New NAS services
# are covered automatically.
$HTTP["host"] =~ "\.tommyq\.cz$" {
    $HTTP["host"] !~ "^(sport|plex)\.tommyq\.cz$" {
        server.errorfile-prefix = "/srv/tommyq/errors/status-"
    }
}

# HTTPS - Base domain specifics
$HTTP["host"] == "tommyq.cz" {
    # SmartHome assistant proxy (must be before alias to take priority)
    $HTTP["url"] =~ "^/(smarthome|oauth)" {
        proxy.server = ( "" => ( (
            "host" => "127.0.0.1",
            "port" => 3443
        ) ) )
        proxy.header = ( "https-remap" => "enable" )
    }

    # Redirect shortcuts to sport subdomain
    $HTTP["url"] =~ "^/(activity|planner|brouter|garage)" {
        url.redirect = ( "^/(.*)" => "https://sport.tommyq.cz/$1" )
    }

    # Dashboard helper CGI: /cgi/wol.cgi wakes the NAS (LAN-only, enforced in the CGI)
    $HTTP["url"] =~ "^/cgi/" {
        alias.url = ( "/cgi" => "/srv/tommyq/cgi" )
        cgi.assign = ( ".cgi" => "" )
    }

    # Static content (dashboard, CA cert)
    $HTTP["url"] !~ "^/(smarthome|oauth|activity|planner|brouter|garage|cgi)" {
        alias.url = ( "/ca.crt" => "/www/ca.crt", "/" => "/www/tommyq/" )
        index-file.names = ( "index.html" )
    }
}