<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gravel Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #16213e; flex-wrap: wrap; }
.toolbar h1 { font-size: 1.1rem; margin-right: auto; }
.toolbar button, .toolbar select { background: #ff6b35; border: none; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
.toolbar button:hover { background: #e55a2b; }
.toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
.toolbar select { background: #2a3a5e; }
.stats { display: flex; gap: 12px; font-size: 0.85rem; color: #aaa; }
.stats span { background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; }
#map { flex: 1; min-height: 0; }
.chart-handle { height: 14px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
.chart-handle::after { content: ''; width: 40px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; }
.chart-box { height: 120px; background: #16213e; padding: 6px 8px; display: flex; }
.chart-box.hidden { display: none; }
#elevChart { width: 100% !important; height: 100% !important; }
.leaflet-marker-icon.waypoint-marker { background: #ff6b35; border: 2px solid #fff; border-radius: 50%; width: 14px !important; height: 14px !important; margin-left: -7px !important; margin-top: -7px !important; }
.leaflet-marker-icon.waypoint-marker.first { background: #2ecc71; }
.leaflet-marker-icon.waypoint-marker.last { background: #e74c3c; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 9999; display: none; }
.toast.error { background: #e74c3c; }
</style>
</head><body>
<div class="toolbar">
  <h1>🚴 Route Planner</h1>
  <select id="profile" title="Profil">
    <option value="gravel" selected>Gravel</option>
    <option value="trekking">Trekking</option>
    <option value="fastbike">Road</option>
  </select>
  <select id="layer" title="Mapa">
    <option value="osm">OSM</option>
    <option value="topo">OpenTopo</option>
    <option value="cyclosm">CyclOSM</option>
    <option value="mtb">mtbmap.cz</option>
  </select>
  <button onclick="undoWaypoint()" title="Zpět">↩️</button>
  <button onclick="clearRoute()" title="Smazat trasu">🗑️</button>
  <button onclick="exportGpx()" id="exportBtn" disabled title="Stáhnout GPX">📥 GPX</button>
  <button onclick="uploadBryton()" id="brytonBtn" disabled title="Nahrát do Bryton">🔼 Bryton</button>
</div>
<div class="stats" id="stats"></div>
<div id="map"></div>
<div class="chart-handle" id="chartHandle"></div>
<div class="chart-box" id="chartBox"><canvas id="elevChart"></canvas></div>
<div class="toast" id="toast"></div>

<script>
// --- Config ---
var BROUTER_API = '/brouter/api/brouter';
var BRYTON_API = '/brouter/cgi/bryton-upload.cgi';

// --- State ---
var waypoints = [];
var routeLayer = null;
var waypointMarkers = [];
var routeData = null; // {coords, distances, elevations}
var chart = null;
var posMarker = null;

// --- Map ---
var tileLayers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OSM', maxZoom: 19}),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution: '© OpenTopoMap', maxZoom: 17}),
  cyclosm: L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {attribution: '© CyclOSM', maxZoom: 19}),
  mtb: L.tileLayer('http://tile.mtbmap.cz/mtbmap_tiles/{z}/{x}/{y}.png', {attribution: '© mtbmap.cz', maxZoom: 18})
};

var map = L.map('map', {preferCanvas: true}).setView([49.2, 16.6], 12);
tileLayers.osm.addTo(map);

document.getElementById('layer').onchange = function() {
  Object.values(tileLayers).forEach(l => map.removeLayer(l));
  tileLayers[this.value].addTo(map);
};

// --- Map click → add waypoint ---
map.on('click', function(e) {
  addWaypoint(e.latlng);
});

function addWaypoint(latlng) {
  waypoints.push(latlng);
  var idx = waypoints.length - 1;
  var cls = 'waypoint-marker' + (idx === 0 ? ' first' : '');
  var marker = L.marker(latlng, {
    icon: L.divIcon({className: cls, iconSize: [14, 14]}),
    draggable: true
  }).addTo(map);
  marker.on('dragend', function() {
    waypoints[idx] = marker.getLatLng();
    updateMarkerClasses();
    calculateRoute();
  });
  waypointMarkers.push(marker);
  updateMarkerClasses();
  if (waypoints.length >= 2) calculateRoute();
}

function updateMarkerClasses() {
  waypointMarkers.forEach(function(m, i) {
    var el = m.getElement();
    if (!el) return;
    el.className = 'leaflet-marker-icon waypoint-marker' + (i === 0 ? ' first' : i === waypointMarkers.length - 1 ? ' last' : '');
  });
}

function undoWaypoint() {
  if (waypoints.length === 0) return;
  waypoints.pop();
  var m = waypointMarkers.pop();
  map.removeLayer(m);
  updateMarkerClasses();
  if (waypoints.length >= 2) calculateRoute();
  else clearRouteDisplay();
}

function clearRoute() {
  waypoints = [];
  waypointMarkers.forEach(m => map.removeLayer(m));
  waypointMarkers = [];
  clearRouteDisplay();
}

function clearRouteDisplay() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  routeData = null;
  document.getElementById('stats').innerHTML = '';
  document.getElementById('exportBtn').disabled = true;
  document.getElementById('brytonBtn').disabled = true;
  if (chart) { chart.data.labels = []; chart.data.datasets[0].data = []; chart.update('none'); }
}

// --- Routing ---
function calculateRoute() {
  var profile = document.getElementById('profile').value;
  var lonlats = waypoints.map(w => w.lng.toFixed(6) + ',' + w.lat.toFixed(6)).join('|');
  var url = BROUTER_API + '?lonlats=' + lonlats + '&profile=' + profile + '&alternativeidx=0&format=geojson';

  fetch(url).then(r => r.json()).then(function(data) {
    if (!data.features || !data.features.length) { showToast('Trasa nenalezena', true); return; }

    var feature = data.features[0];
    var coords = feature.geometry.coordinates.map(c => [c[1], c[0]]);
    var elevations = feature.geometry.coordinates.map(c => c[2] || 0);
    var props = feature.properties;
    var trackLength = parseInt(props['track-length']) / 1000;
    var ascend = props['filtered ascend'] || props['plain-ascend'] || 0;
    var totalTime = parseInt(props['total-time'] || 0);

    // Build distances array
    var distances = [0];
    for (var i = 1; i < coords.length; i++) {
      var d = map.distance(coords[i-1], coords[i]);
      distances.push(distances[i-1] + d / 1000);
    }

    routeData = {coords: coords, distances: distances, elevations: elevations, trackLength: trackLength, ascend: ascend, gpxCoords: feature.geometry.coordinates};

    // Display route
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(coords, {color: '#ff6b35', weight: 4, opacity: 0.8}).addTo(map);

    // Stats
    var timeStr = totalTime > 0 ? Math.floor(totalTime/3600) + 'h ' + Math.floor((totalTime%3600)/60) + 'min' : '';
    document.getElementById('stats').innerHTML =
      '<span>📏 ' + trackLength.toFixed(1) + ' km</span>' +
      '<span>⛰️ +' + ascend + ' m</span>' +
      (timeStr ? '<span>⏱️ ' + timeStr + '</span>' : '');

    document.getElementById('exportBtn').disabled = false;
    document.getElementById('brytonBtn').disabled = false;

    // Elevation chart
    updateChart(distances, elevations);
  }).catch(function(e) {
    showToast('Chyba routingu: ' + e.message, true);
  });
}

document.getElementById('profile').onchange = function() {
  if (waypoints.length >= 2) calculateRoute();
};

// --- Elevation chart ---
function updateChart(distances, elevations) {
  var step = Math.max(1, Math.floor(distances.length / 300));
  var labels = [], data = [];
  for (var i = 0; i < distances.length; i += step) {
    labels.push(distances[i].toFixed(1));
    data.push(elevations[i]);
  }

  if (!chart) {
    posMarker = L.circleMarker([0,0], {radius: 7, color: '#fff', weight: 2, fillColor: '#ff6b35', fillOpacity: 1});
    chart = new Chart(document.getElementById('elevChart'), {
      type: 'line',
      data: { labels: labels, datasets: [{label: 'Výška (m)', data: data, borderColor: '#f39c12', backgroundColor: '#f39c1233', borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.1}] },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: {display: false}, y: {ticks: {color: '#888', maxTicksLimit: 4}, grid: {color: '#333'}} },
        plugins: { legend: {display: false}, tooltip: { callbacks: { title: items => items[0].label + ' km' } } },
        interaction: { mode: 'index', intersect: false },
        onHover: function(event, elements, ch) {
          if (elements.length && routeData) {
            var idx = elements[0].index * step;
            if (idx < routeData.coords.length) {
              posMarker.setLatLng(routeData.coords[idx]);
              if (!map.hasLayer(posMarker)) posMarker.addTo(map);
            }
          } else { map.removeLayer(posMarker); }
        }
      }
    });
    document.getElementById('elevChart').addEventListener('mouseleave', function() { map.removeLayer(posMarker); });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = data;
    chart.update('none');
  }
}

// --- Chart resize ---
(function() {
  var handle = document.getElementById('chartHandle');
  var chartBox = document.getElementById('chartBox');
  var dragging = false, startY = 0, startH = 0, moved = false;

  function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }
  function onStart(e) {
    if (chartBox.classList.contains('hidden')) { chartBox.classList.remove('hidden'); if(chart) chart.resize(); return; }
    dragging = true; moved = false; startY = getY(e); startH = chartBox.offsetHeight; e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var dy = startY - getY(e);
    if (Math.abs(dy) > 5) moved = true;
    chartBox.style.height = Math.max(60, Math.min(400, startH + dy)) + 'px';
    e.preventDefault();
  }
  function onEnd() {
    if (!dragging) return; dragging = false;
    if (!moved) { chartBox.classList.toggle('hidden'); }
    if (chart) chart.resize(); map.invalidateSize();
  }
  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, {passive: false});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive: false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
})();

// --- Export GPX ---
function exportGpx() {
  if (!routeData) return;
  var pts = routeData.gpxCoords.map(c => '    <trkpt lat="'+c[1]+'" lon="'+c[0]+'"><ele>'+Math.round(c[2] || 0)+'</ele></trkpt>').join('\n');
  var gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="tommyq.cz/brouter">\n<trk><name>Gravel Route ' + routeData.trackLength.toFixed(1) + 'km</name><trkseg>\n' + pts + '\n</trkseg></trk></gpx>';
  var blob = new Blob([gpx], {type: 'application/gpx+xml'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'route_' + routeData.trackLength.toFixed(0) + 'km.gpx';
  a.click();
}

// --- Upload to Bryton ---
function uploadBryton() {
  if (!routeData) return;
  var btn = document.getElementById('brytonBtn');
  btn.disabled = true; btn.textContent = '⏳';

  var pts = routeData.gpxCoords.map(c => '    <trkpt lat="'+c[1]+'" lon="'+c[0]+'"><ele>'+Math.round(c[2] || 0)+'</ele></trkpt>').join('\n');
  var gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="tommyq.cz/brouter">\n<trk><name>Gravel Route ' + routeData.trackLength.toFixed(1) + 'km</name><trkseg>\n' + pts + '\n</trkseg></trk></gpx>';

  fetch(BRYTON_API, {
    method: 'POST',
    headers: {'Content-Type': 'application/gpx+xml'},
    body: gpx
  }).then(r => r.json()).then(function(d) {
    if (d.status === 'ok') showToast('✓ Nahráno do Bryton: ' + (d.name || ''));
    else showToast('Chyba: ' + (d.error || 'neznámá'), true);
  }).catch(function(e) {
    showToast('Chyba uploadu: ' + e.message, true);
  }).finally(function() {
    btn.disabled = false; btn.textContent = '🔼 Bryton';
  });
}

// --- Toast ---
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}
</script>
</body></html>
