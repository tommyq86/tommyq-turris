# tommyq.cz - Tools & Downloading (Dozzle, DSM, Download Station, FileZilla, JDownloader, Portainer, qBittorrent)
$HTTP["host"] =~ "\.tommyq\.cz$" {

    $HTTP["host"] == "dozzle.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 9999 ) ) )
        proxy.header = ( "upgrade" => "enable" )
        server.stream-response-body = 2
        setenv.add-request-header = ( 
            "X-Forwarded-Proto" => "https",
            "X-Forwarded-Host" => "dozzle.tommyq.cz"
        )
    }

    $HTTP["host"] == "dsm.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 5000 ) ) )
        proxy.header = ( "upgrade" => "enable" )
    }

    $HTTP["host"] == "download.tommyq.cz" {
        url.redirect = ( "^/(.*)" => "https://dsm.tommyq.cz/download/$1" )
    }

    $HTTP["host"] == "filezilla.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 7171 ) ) )
        proxy.header = ( "upgrade" => "enable" )
        setenv.add-request-header = ( 
            "X-Forwarded-Proto" => "https",
            "X-Forwarded-Host" => "filezilla.tommyq.cz"
        )
    }

    $HTTP["host"] == "jdownloader.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 5800 ) ) )
        proxy.header = ( "upgrade" => "enable" )
        setenv.add-request-header = ( 
            "X-Forwarded-Proto" => "https",
            "X-Forwarded-Host" => "jdownloader.tommyq.cz"
        )
    }

    $HTTP["host"] == "portainer.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 9000 ) ) )
    }

    $HTTP["host"] == "actual.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 5006 ) ) )
    }

    $HTTP["host"] == "qbittorrent.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 8081 ) ) )
        setenv.add-request-header = ( 
            "X-Forwarded-Proto" => "https",
            "X-Forwarded-Host" => "qbittorrent.tommyq.cz"
        )
    }

    $HTTP["host"] == "iventoy.tommyq.cz" {
        proxy.server = ( "" => ( ( "host" => var.nas_ip, "port" => 26000 ) ) )
        proxy.header = ( "upgrade" => "enable" )
        # NOTE: settings page (POST /iventoy/json) is broken over HTTP/2 because
        # iVentoy's built-in HTTP server can't parse a chunked request body that
        # lighttpd produces when proxying h2 POSTs. Fix TODO (nginx h1.1 sidecar
        # on leo, or global h2 off). Works fine direct over HTTP/1.1.
        setenv.add-request-header = ( 
            "X-Forwarded-Proto" => "https",
            "X-Forwarded-Host" => "iventoy.tommyq.cz"
        )
    }
}
