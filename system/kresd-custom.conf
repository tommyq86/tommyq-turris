-- Limit cache to 50 MB
cache.size = 50 * MB

-- Načíst modul policy
modules.load('policy')

-- Přepsání *.tommyq.cz i tommyq.cz na 192.168.2.1 (split-horizon).
-- A → 192.168.2.1. AAAA se vrací jako čisté NODATA (nodata=true), NE prázdná
-- tabulka {} — ta produkovala SERVFAIL, kvůli kterému IPv6-capable klienti
-- (Windows, Android) padali na veřejné Cloudflare IPv6 a admin přes LAN pak
-- selhal (REMOTE_ADDR = Cloudflare, ne 192.168.2.x). NODATA je přinutí použít A.
policy.add(policy.suffix(
    policy.ANSWER(
        { [kres.type.A] = { rdata = kres.str2ip('192.168.2.1'), ttl = 300 } },
        true  -- nodata: pro ostatní typy (vč. AAAA) vrať NODATA, ne SERVFAIL
    ),
    { todname('tommyq.cz') }
))

-- Statické stroje natvrdo v Kresdu (neovlivní je DHCP ani Turris skripty)
