# Globální proměnné pro tommyq.cz
var.nas_ip = "192.168.2.4"

# HTTP/2 tuning - increase limits for connection issues
server.feature-flags += (
    "server.h2c" => "enable",
    "server.h2-max-concurrent-streams" => 128,
    "server.h2-max-header-list-size" => 65536
)

# tommyq.cz - Base domain configuration
# Redirect HTTP to HTTPS (except ca.crt)
$HTTP["scheme"] == "http" {
    $HTTP["host"] =~ "(^|\.)tommyq\.cz$" {
        $HTTP["url"] != "/ca.crt" {
            url.redirect = ( "^/(.*)" => "https://%0/$1" )
        }
    }
}

# HTTPS - Global SSL for tommyq.cz and *.tommyq.cz
$HTTP["host"] =~ "(^|\.)tommyq\.cz$" {
    ssl.pemfile = "/etc/ssl/certs/turris_combined.pem"
}

# Services on leo: instead of a bare 500/502/503/504 (leo asleep, container restarting)
# show a loading screen that wakes leo, waits for the service and reloads itself
# (errors/status-503.html, deployed as status-{500,502,503,504}.html). Applies to every
# *.tommyq.cz vhost except sport (its own CGI/tile/BRouter errors must stay plain
# for API clients) and Plex (has its own fallback to app.plex.tv). New leo services
# are covered automatically.
$HTTP["host"] =~ "\.tommyq\.cz$" {
    $HTTP["host"] !~ "^(sport|plex)\.tommyq\.cz$" {
        server.errorfile-prefix = "/srv/tommyq/errors/status-"
    }
}

# HTTPS - Base domain specifics
$HTTP["host"] == "tommyq.cz" {
    # SmartHome assistant proxy (must be before alias to take priority)
    $HTTP["url"] =~ "^/(smarthome|oauth)" {
        proxy.server = ( "" => ( (
            "host" => "127.0.0.1",
            "port" => 3443
        ) ) )
        proxy.header = ( "https-remap" => "enable" )
    }

    # Redirect shortcuts to sport subdomain
    $HTTP["url"] =~ "^/(activity|planner|brouter|garage)" {
        url.redirect = ( "^/(.*)" => "https://sport.tommyq.cz/$1" )
    }

    # Dashboard helper CGI: /cgi/wol.cgi wakes leo (LAN-only, enforced in the CGI)
    $HTTP["url"] =~ "^/cgi/" {
        alias.url = ( "/cgi" => "/srv/tommyq/cgi" )
        cgi.assign = ( ".cgi" => "" )
    }

    # Static content (dashboard, CA cert)
    $HTTP["url"] !~ "^/(smarthome|oauth|activity|planner|brouter|garage|cgi)" {
        alias.url = ( "/ca.crt" => "/www/ca.crt", "/" => "/www/tommyq/" )
        index-file.names = ( "index.html" )
    }
}